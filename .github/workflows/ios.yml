name: Client build and tests
on:
  push:
    branches: ['feat/**', 'fix/**', 'ci/**', main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: client-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -version
      - name: Test on simulator
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -runFirstLaunch
          xcodebuild -project SignalKit.xcodeproj -scheme SignalKit -showdestinations > "$RUNNER_TEMP/destinations.txt"
          simulator_id=$(sed -nE '/platform:iOS Simulator.*name:iPhone/ s/.*id:([0-9A-Fa-f-]{36}).*/\1/p' "$RUNNER_TEMP/destinations.txt" | head -n 1)
          test -n "$simulator_id"
          xcodebuild test -project SignalKit.xcodeproj -scheme SignalKit \
            -destination "platform=iOS Simulator,id=$simulator_id" \
            -parallel-testing-enabled NO -resultBundlePath build/Tests.xcresult CODE_SIGNING_ALLOWED=NO
      - name: Build unsigned device client
        run: |
          xcodebuild build -project SignalKit.xcodeproj -scheme SignalKit \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO
      - name: Package and validate
        run: |
          mkdir -p build/Payload
          cp -R build/DerivedData/Build/Products/Release-iphoneos/SignalKit.app build/Payload/
          (cd build && zip -qr SignalKit-unsigned.ipa Payload)
          python3 scripts/validate_ipa.py build/SignalKit-unsigned.ipa
          shasum -a 256 build/SignalKit-unsigned.ipa
      - name: Upload unsigned package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SignalKit-unsigned
          path: build/SignalKit-unsigned.ipa
          retention-days: 7
          if-no-files-found: error
      - name: Upload synthetic test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Client-tests
          path: build/Tests.xcresult
          retention-days: 3
          if-no-files-found: warn
