name: SignalKit
options:
  bundleIdPrefix: org.regionalsignal
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGNING_ALLOWED: NO
targets:
  SignalKit:
    type: application
    platform: iOS
    sources: [SignalKit]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.regionalsignal.client
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Signal Kit
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  SignalKitTests:
    type: bundle.unit-test
    platform: iOS
    sources: [SignalKitTests]
    dependencies:
      - target: SignalKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  SignalKitUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [SignalKitUITests]
    dependencies:
      - target: SignalKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  SignalKit:
    build:
      targets:
        SignalKit: all
    test:
      targets: [SignalKitTests, SignalKitUITests]
